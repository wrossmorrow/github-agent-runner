apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agenticrunnermcpservers.agentic.example.io
spec:
  group: agentic.example.io
  names:
    kind: AgenticRunnerMCPServer
    listKind: AgenticRunnerMCPServerList
    plural: agenticrunnermcpservers
    singular: agenticrunnermcpserver
    shortNames:
      - armcp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              properties:
                url:
                  type: string
                command:
                  type: string
                args:
                  type: array
                  items:
                    type: string
                headers:
                  type: object
                  additionalProperties:
                    type: string
                authSecretRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                egressAllowlist:
                  type: array
                  items:
                    type: string
                agentsMd:
                  type: string
