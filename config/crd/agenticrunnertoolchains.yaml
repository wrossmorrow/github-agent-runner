apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agenticrunnertoolchains.agentic.example.io
spec:
  group: agentic.example.io
  names:
    kind: AgenticRunnerToolchain
    listKind: AgenticRunnerToolchainList
    plural: agenticrunnertoolchains
    singular: agenticrunnertoolchain
    shortNames:
      - artc
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      additionalProperties:
                        type: string
                    limits:
                      type: object
                      additionalProperties:
                        type: string
                egressAllowlist:
                  type: array
                  items:
                    type: string
                agentsMd:
                  type: string
