apiVersion: v1
kind: Namespace
metadata:
  name: agentrunner-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentrunner-controller
  namespace: agentrunner-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentrunner-controller
rules:
  - apiGroups: ["agentic.example.io"]
    resources: ["agenticrunnertoolchains", "agenticrunnerdeployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agentic.example.io"]
    resources: ["agenticrunnerdeployments/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "delete", "get", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["actions.github.com"]
    resources: ["autoscalingrunnersets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentrunner-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentrunner-controller
subjects:
  - kind: ServiceAccount
    name: agentrunner-controller
    namespace: agentrunner-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentrunner-controller
  namespace: agentrunner-system
  labels:
    app.kubernetes.io/name: agentrunner-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentrunner-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentrunner-controller
    spec:
      serviceAccountName: agentrunner-controller
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: agentrunner-controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          ports:
            - name: health
              containerPort: 8081
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
