# =============================================================================
# STATUS: IMPLEMENTED (v0.0.7+) (see examples/FUTURE.md)
#
# TIER & PURPOSE:
#   Tier 1 (Read-Only Code) — Release Notes Drafter.
#   Triggered when a semver tag is pushed; inspects actual diffs and merged
#   PRs since the previous tag and writes a categorized draft GitHub Release
#   with breaking-change and upgrade notes.
#
# REQUIRED GITHUB APP PERMISSIONS (release-bot):
#   - Contents: Read & write   (needed by GitHub Releases API to create drafts;
#                               protect branches/tags so main/tags cannot be rewritten)
#   - Pull requests: Read-only
#
# SETUP NOTES:
#   - `output: release-draft`, tag-range resolution (`resolvePreviousTag`), and
#     Markdown release output are implemented in pkg/review and action/action.yml.
#   - Deploy with a dedicated `release-bot` GitHub App (or grant `Contents: R/W`
#     with branch/tag protection) on the runner deployment.
# =============================================================================

name: Draft Release Notes

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to draft notes for
        required: true
        type: string

permissions:
  contents: read

jobs:
  draft-release:
    runs-on: agentic-go-review
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: wrossmorrow/github-agent-runner/action@vx.y.z
        with:
          instructions: |
            Identify the previous release tag before ${{ inputs.tag || github.ref_name }}, inspect the commit
            history and actual code diff since that tag, and draft release notes grouped into:
            Breaking Changes, Features, Bug Fixes, and Tooling/CI. Verify every referenced flag
            or CRD field against the actual code at ${{ inputs.tag || github.ref_name }}.
          fail-on: none
          output: release-draft
          tag: ${{ inputs.tag || github.ref_name }}
