apiVersion: agentic.example.io/v1alpha1
kind: AgenticRunnerToolchain
metadata:
  name: go-1.26
spec:
  image: ghcr.io/wrossmorrow/agentrunner-golang:1.26
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  egressAllowlist:
    - proxy.golang.org
    - sum.golang.org
  agentsMd: |
    Toolchain: Go 1.26, protoc, buf, git, gh.
    Prefer `go test -race ./...` when validating Go changes.
