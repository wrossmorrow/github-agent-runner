apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentrunner-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentrunner-controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentrunner-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentrunner-controller.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "agentrunner-controller.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - --health-probe-bind-address={{ .Values.controller.healthProbeBindAddress }}
            - --metrics-bind-address={{ .Values.controller.metricsBindAddress }}
            - --arc-controller-namespace={{ .Values.controller.arcControllerNamespace }}
            - --arc-controller-sa={{ .Values.controller.arcControllerServiceAccount }}
            - --github-auth-image={{ .Values.controller.githubAuthImage }}
            - --image-pull-policy={{ .Values.controller.imagePullPolicy }}
            {{- if .Values.controller.arcVersion }}
            - --arc-version={{ .Values.controller.arcVersion }}
            {{- end }}
            {{- if .Values.controller.leaderElect }}
            - --leader-elect
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
