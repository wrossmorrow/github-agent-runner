name: Agentic Runner
description: Run a headless agentic task via the local agent sidecar.
inputs:
  instructions:
    description: What the agent should inspect, verify, or check
    required: true
  fail-on:
    description: Fail the step on severity (none | warning | error)
    default: error
  output:
    description: Output target (pr-review | suggest | comment | issue-comment | release-draft | branch-commit | revert-pr | stdout)
    default: pr-review
  branch:
    description: Target branch for branch-commit / revert-pr (defaults to PR head/current branch for branch-commit, bot/revert-<short-sha> for revert-pr; required in detached-HEAD non-PR runs)
    default: ""
  open-pr:
    description: Open a pull request after pushing for branch-commit output (true | false; revert-pr always opens a PR)
    default: "false"
  tag:
    description: Git tag name for release-draft output (defaults to GITHUB_REF_NAME on tag pushes)
    default: ""
  endpoint:
    description: Local agentrunnerd HTTP endpoint
    default: http://127.0.0.1:8788/run
outputs:
  verdict:
    description: Structured verdict returned by the agent (e.g. APPROVE, COMMENT, REQUEST_CHANGES)
    value: ${{ steps.run.outputs.verdict }}
  summary:
    description: Concise summary returned by the agent
    value: ${{ steps.run.outputs.summary }}
  findings:
    description: Number of findings emitted by the agent
    value: ${{ steps.run.outputs.findings }}
  turns:
    description: Number of agent turns executed
    value: ${{ steps.run.outputs.turns }}
  exit-code:
    description: Exit code determined from fail-on threshold
    value: ${{ steps.run.outputs.exit-code }}
  session-id:
    description: Unique session UUID generated for this agent run
    value: ${{ steps.run.outputs.session-id }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        AGENT_INSTRUCTIONS: ${{ inputs.instructions }}
        AGENT_FAIL_ON: ${{ inputs.fail-on }}
        AGENT_OUTPUT: ${{ inputs.output }}
        AGENT_BRANCH: ${{ inputs.branch }}
        AGENT_OPEN_PR: ${{ inputs.open-pr }}
        AGENT_TAG: ${{ inputs.tag }}
        AGENT_ENDPOINT: ${{ inputs.endpoint }}
      run: |
        set -euo pipefail
        tmp_out="$(mktemp)"
        trap 'rm -f "$tmp_out"' EXIT

        tag_val="$AGENT_TAG"
        if [ -z "$tag_val" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
          tag_val="${GITHUB_REF_NAME:-}"
        fi

        open_pr_bool=false
        if [ "$AGENT_OPEN_PR" = "true" ]; then
          open_pr_bool=true
        fi

        # Grant group-write on the checkout so the agent sidecar (UID 1000) can edit
        # files and write .git state alongside the runner (UID 1001) via SharedFSGroup.
        if [ "$AGENT_OUTPUT" = "branch-commit" ] || [ "$AGENT_OUTPUT" = "revert-pr" ]; then
          chmod -R g+w "$GITHUB_WORKSPACE"
        fi

        jq -n \
          --arg workspace "$GITHUB_WORKSPACE" \
          --arg eventPath "$GITHUB_EVENT_PATH" \
          --arg eventName "$GITHUB_EVENT_NAME" \
          --arg instructions "$AGENT_INSTRUCTIONS" \
          --arg failOn "$AGENT_FAIL_ON" \
          --arg output "$AGENT_OUTPUT" \
          --arg targetBranch "$AGENT_BRANCH" \
          --argjson openPr "$open_pr_bool" \
          --arg tag "$tag_val" \
          --arg repo "$GITHUB_REPOSITORY" \
          --arg runId "$GITHUB_RUN_ID" \
          '{workspace:$workspace, eventPath:$eventPath, eventName:$eventName, instructions:$instructions, failOn:$failOn, output:$output, targetBranch:$targetBranch, openPr:$openPr, tag:$tag, repo:$repo, runId:$runId}' \
        | curl --fail-with-body -sSN -X POST \
            -H 'Content-Type: application/json' \
            --data-binary @- \
            "$AGENT_ENDPOINT" \
        | tee "$tmp_out"

        result_line="$(grep '^AGENTRUNNER_RESULT=' "$tmp_out" | tail -n1 || true)"
        if [ -z "$result_line" ]; then
          echo "::error::agentrunnerd did not emit AGENTRUNNER_RESULT"
          exit 1
        fi

        result_json="${result_line#AGENTRUNNER_RESULT=}"
        verdict="$(printf '%s' "$result_json" | jq -r '.verdict // ""')"
        summary="$(printf '%s' "$result_json" | jq -r '.summary // ""')"
        findings="$(printf '%s' "$result_json" | jq -r '.findings // 0')"
        turns="$(printf '%s' "$result_json" | jq -r '.turns // 0')"
        exit_code="$(printf '%s' "$result_json" | jq -r '.exitCode // 1')"
        session_id="$(printf '%s' "$result_json" | jq -r '.sessionId // ""')"

        if [ -n "${GITHUB_OUTPUT:-}" ]; then
          eof_delim="AGENTRUNNER_EOF_$$_${RANDOM}"
          {
            printf 'verdict<<%s\n%s\n%s\n' "$eof_delim" "$verdict" "$eof_delim"
            printf 'findings=%s\n' "$findings"
            printf 'turns=%s\n' "$turns"
            printf 'exit-code=%s\n' "$exit_code"
            printf 'session-id=%s\n' "$session_id"
            printf 'summary<<%s\n%s\n%s\n' "$eof_delim" "$summary" "$eof_delim"
          } >> "$GITHUB_OUTPUT"
        fi

        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            printf '### Agentrunner Result\n\n'
            printf -- '- **Verdict:** `%s`\n' "${verdict:-N/A}"
            printf -- '- **Findings:** `%s`\n' "$findings"
            printf -- '- **Turns:** `%s`\n' "$turns"
            if [ -n "$summary" ]; then
              printf '\n%s\n' "$summary"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        exit "$exit_code"
