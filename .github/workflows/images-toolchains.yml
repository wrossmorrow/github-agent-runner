name: Toolchain Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - 'images/toolchains/**'
      - 'api/**'
      - 'pkg/pirpc/**'
      - 'pkg/review/**'
      - 'cmd/agentrunnerd/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/images-toolchains.yml'
  workflow_dispatch:
    inputs:
      toolchain:
        description: Toolchain target to build
        type: choice
        default: all
        options:
          - all
          - agent
          - python
          - golang
          - rust
          - java17
          - java21
      push:
        description: Push built images to GHCR
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: images-toolchains-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  plan:
    name: Select toolchains
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.toolchain }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$TARGET" ] && [ "$TARGET" != "all" ]; then
            echo "matrix=[\"${TARGET}\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["agent","python","golang","rust","java17","java21"]' >> "$GITHUB_OUTPUT"
          fi

  toolchains:
    name: Toolchain (${{ matrix.toolchain }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push)

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/agentrunner-${{ matrix.toolchain }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: images/toolchains/Dockerfile
          target: ${{ matrix.toolchain }}
          platforms: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push)) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=toolchain-${{ matrix.toolchain }}
          cache-to: type=gha,mode=max,scope=toolchain-${{ matrix.toolchain }}
