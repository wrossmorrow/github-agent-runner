name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      lint: ${{ steps.filter.outputs.lint }}
      action_smoke: ${{ steps.filter.outputs.action_smoke }}
      usage_sink: ${{ steps.filter.outputs.usage_sink }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          go=false
          lint=false
          action_smoke=false
          usage_sink=false

          if [ "$EVENT_NAME" != "pull_request" ]; then
            go=true
            lint=true
            action_smoke=true
            usage_sink=true
          else
            changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
            if printf '%s\n' "$changed" | grep -Eq '^(api|cmd|pkg)/|^go\.(mod|sum)$|^justfile$|^\.github/workflows/ci\.yml$'; then
              go=true
            fi
            if printf '%s\n' "$changed" | grep -Eq '^(\.github|action|config|charts|examples)/'; then
              lint=true
            fi
            if printf '%s\n' "$changed" | grep -Eq '^action/|^cmd/agentrunnerd/|^pkg/(review|pirpc)/|^api/|^go\.(mod|sum)$|^\.github/workflows/ci\.yml$'; then
              action_smoke=true
            fi
            if printf '%s\n' "$changed" | grep -Eq '^addons/usage-sink/|^justfile$|^\.github/workflows/ci\.yml$'; then
              usage_sink=true
            fi
          fi

          {
            echo "go=${go}"
            echo "lint=${lint}"
            echo "action_smoke=${action_smoke}"
            echo "usage_sink=${usage_sink}"
          } >> "$GITHUB_OUTPUT"

  go:
    name: Go checks
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@v4

      - name: Run validation suite
        run: just check

      - name: Render example manifests
        run: just render-summary

  lint:
    name: Lint workflows & YAML
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Lint GitHub Actions workflows
        run: |
          actionlint
          actionlint -ignore 'label "agentic-go-review" is unknown' examples/workflow-agent-review.yml

      - name: Validate YAML manifests
        run: |
          python3 -c '
          import glob, sys, yaml
          paths = sorted(
              glob.glob(".github/workflows/*.yml")
              + glob.glob("action/*.yml")
              + glob.glob("config/crd/*.yaml")
              + glob.glob("config/controller/*.yaml")
              + glob.glob("charts/agentrunner-controller/crds/*.yaml")
              + glob.glob("examples/*.yaml")
              + glob.glob("examples/*.yml")
          )
          for p in paths:
              with open(p, "r", encoding="utf-8") as f:
                  list(yaml.safe_load_all(f))
              print(f"ok: {p}")
          '

      - name: Lint and template Helm chart
        run: |
          helm lint charts/agentrunner-controller
          helm template agentrunner-controller charts/agentrunner-controller > /dev/null
          diff -u config/crd/agenticrunnerdeployments.yaml charts/agentrunner-controller/crds/agenticrunnerdeployments.yaml
          diff -u config/crd/agenticrunnertoolchains.yaml charts/agentrunner-controller/crds/agenticrunnertoolchains.yaml

  action-smoke:
    name: Action smoke test
    needs: changes
    if: needs.changes.outputs.action_smoke == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and start agentrunnerd with fake pi
        run: |
          cat <<'EOF' > /tmp/fake-pi.sh
          #!/usr/bin/env bash
          set -euo pipefail
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            cmd_type="$(printf '%s' "$line" | jq -r '.type // ""')"
            cmd_id="$(printf '%s' "$line" | jq -r '.id // ""')"
            if [ "$cmd_type" = "prompt" ]; then
              jq -cn --arg id "$cmd_id" '{type:"response",id:$id,success:true}'
              printf '%s\n' '{"type":"turn_start"}'
              printf '%s\n' '{"type":"tool_execution_start","toolName":"read"}'
              printf '%s\n' '{"type":"tool_execution_end","result":{"ok":true}}'
              printf '%s\n' '{"type":"agent_end","messages":[{"role":"assistant","content":"{\"verdict\":\"APPROVE\",\"summary\":\"Smoke test passed\",\"comments\":[]}"}]}'
            fi
          done
          EOF
          chmod +x /tmp/fake-pi.sh

          cat <<'EOF' > /tmp/agentrunner-config.json
          {
            "piBin": "/tmp/fake-pi.sh",
            "piArgs": ["--mode", "rpc"],
            "harness": "pi",
            "model": "smoke-test",
            "gatewayEndpoint": "http://127.0.0.1:11500/v1",
            "limits": {
              "maxTurns": 5,
              "maxDuration": "30s"
            }
          }
          EOF

          go build -o /tmp/agentrunnerd ./cmd/agentrunnerd
          AGENTRUNNER_CONFIG=/tmp/agentrunner-config.json \
            /tmp/agentrunnerd > /tmp/agentrunnerd.log 2>&1 &
          echo $! > /tmp/agentrunnerd.pid

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8788/healthz > /dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/agentrunnerd.log
          exit 1

      - name: Run composite action against local agentrunnerd
        uses: ./action
        with:
          instructions: Smoke test review
          fail-on: error
          output: stdout

      - name: Stop agentrunnerd
        if: ${{ !cancelled() }}
        run: |
          if [ -f /tmp/agentrunnerd.pid ]; then
            kill "$(cat /tmp/agentrunnerd.pid)" 2>/dev/null || true
          fi

  usage-sink:
    name: Usage Sink checks
    needs: changes
    if: needs.changes.outputs.usage_sink == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: addons/usage-sink/go.mod
          cache-dependency-path: addons/usage-sink/go.sum

      - uses: extractions/setup-just@v4

      - name: Run usage-sink validation suite
        run: just check-usage-sink
