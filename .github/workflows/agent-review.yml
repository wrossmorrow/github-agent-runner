name: Agent Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: github-agent-runner-review
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./action
        with:
          instructions: |
            Review the PR diff against ${{ github.base_ref }}.
            Deterministic checks (gofmt, go vet, go test -race, helm lint, actionlint, CRD diff)
            already run in CI—do NOT spend turns repeating style or formatting nits.

            Focus on:
            1. Security & isolation boundaries: ensure secrets/tokens never leak into the stock
               `runner` container, and RBAC, NetworkPolicy, Squid allowlists, and CRD validation
               remain least-privilege.
            2. Cross-layer consistency: if CRD types, controller behavior, or action inputs change,
               check that validation, pkg/render, config/crd schemas, Helm chart templates/schema,
               and docs stay consistent.
            3. Reliability & edge cases: look for subtle bugs in controller reconciliation, RPC/process
               lifecycle, error handling, or missing unit tests for new behavior.

            Only emit `error` severity for concrete bugs, security regressions, or broken invariants.
            For small, locally verified fixes inside a single diff hunk, you may include a
            "suggestion" (and optional "startLine" < "line") on the inline comment.
          fail-on: error
          output: suggest
