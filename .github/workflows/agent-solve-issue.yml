name: Agent Solve Issue

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to implement and open a PR for
        required: true
        type: string
      branch:
        description: Target branch name (defaults to bot/issue-<issue_number>)
        required: false
        type: string
        default: ""
      extra_instructions:
        description: Optional extra guidance appended to the agent prompt
        required: false
        type: string
        default: ""
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: agent-solve-issue-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  solve:
    name: "Solve Issue #${{ inputs.issue_number || github.event.issue.number }}"
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          !github.event.issue.pull_request &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
          startsWith(github.event.comment.body, '/solve')
        )
      }}
    runs-on: github-agent-runner-author
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          TARGET_BRANCH: ${{ inputs.branch }}
          EXTRA_INSTRUCTIONS: ${{ inputs.extra_instructions }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$ISSUE_NUMBER" | grep -Eq '^[0-9]+$'; then
            echo "::error::issue_number must be numeric, got: $ISSUE_NUMBER"
            exit 1
          fi

          extra="$EXTRA_INSTRUCTIONS"
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            if ! printf '%s' "$COMMENT_BODY" | grep -Eq '^/solve([[:space:]]|$)'; then
              echo "::error::comment trigger must start with /solve"
              exit 1
            fi
            extra="$(printf '%s' "$COMMENT_BODY" | sed -E '1s#^/solve[[:space:]]*##')"
          fi

          branch="$TARGET_BRANCH"
          if [ -z "$branch" ]; then
            branch="bot/issue-${ISSUE_NUMBER}"
          fi
          case "$branch" in
            -*|/*|*/|*.|*..*|*//*)
              echo "::error::invalid target branch: $branch"
              exit 1
              ;;
          esac
          if ! printf '%s' "$branch" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::invalid target branch characters: $branch"
            exit 1
          fi
          lower_branch="$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]')"
          if [ "$lower_branch" = "main" ] || [ "$lower_branch" = "master" ] || [ "$lower_branch" = "head" ]; then
            echo "::error::refusing protected target branch: $branch"
            exit 1
          fi

          issue_json="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          issue_title="$(printf '%s' "$issue_json" | jq -r '.title')"
          issue_body="$(printf '%s' "$issue_json" | jq -r '.body // ""')"
          issue_url="$(printf '%s' "$issue_json" | jq -r '.html_url')"

          delim="AGENTRUNNER_ISSUE_EOF_$$_${RANDOM}"
          {
            printf 'branch=%s\n' "$branch"
            printf 'instructions<<%s\n' "$delim"
            printf 'Implement the changes requested in GitHub Issue #%s (%s).\n\n' "$ISSUE_NUMBER" "$issue_url"
            printf 'Title: %s\n\n' "$issue_title"
            if [ -n "$issue_body" ]; then
              printf 'Issue description:\n%s\n\n' "$issue_body"
            fi
            if [ -n "$extra" ]; then
              printf 'Additional guidance:\n%s\n\n' "$extra"
            fi
            cat <<'REQ_EOF'
          Requirements:
          - Make minimal, clean, well-tested changes scoped to this issue.
          - Add or update unit tests covering the new behavior.
          - Run `just check` (and any other relevant local verification) before finishing.
          - Do not commit, push, or open a PR manually; `agentrunnerd` handles git push and PR creation.
          REQ_EOF
            printf -- '- Include Closes #%s in your summary.\n' "$ISSUE_NUMBER"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      - uses: ./action
        with:
          instructions: ${{ steps.issue.outputs.instructions }}
          fail-on: none
          output: branch-commit
          branch: ${{ steps.issue.outputs.branch }}
          open-pr: "true"
