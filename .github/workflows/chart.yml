name: Helm Chart

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Chart/app version override (defaults to 0.0.0-<short-sha>)
        type: string
        default: ''
      push:
        description: Push packaged chart to GHCR OCI registry
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: chart-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-publish:
    name: Package & publish chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify CRD parity & lint chart
        run: |
          diff -u config/crd/agenticrunnerdeployments.yaml charts/agentrunner-controller/crds/agenticrunnerdeployments.yaml
          diff -u config/crd/agenticrunnertoolchains.yaml charts/agentrunner-controller/crds/agenticrunnertoolchains.yaml
          helm lint charts/agentrunner-controller

      - name: Resolve chart version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            ver="${INPUT_VERSION#v}"
          elif [ "$REF_TYPE" = "tag" ]; then
            ver="${REF_NAME#v}"
          else
            short_sha="$(git rev-parse --short HEAD)"
            ver="0.0.0-${short_sha}"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Package chart
        env:
          CHART_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p /tmp/charts
          helm package charts/agentrunner-controller \
            --version "$CHART_VERSION" \
            --app-version "$CHART_VERSION" \
            --destination /tmp/charts
          ls -lh /tmp/charts

      - name: Push chart to GHCR OCI
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc="$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push /tmp/charts/agentrunner-controller-*.tgz "oci://ghcr.io/${owner_lc}/charts"
